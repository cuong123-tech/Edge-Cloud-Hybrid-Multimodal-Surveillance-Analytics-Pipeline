[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "surveillance-pipeline"
version = "0.1.0"
description = "Edge-cloud hybrid surveillance pipeline (shared schemas + edge dev)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "websockets>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
